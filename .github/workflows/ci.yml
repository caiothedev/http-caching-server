name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}${{ matrix.sanitizers == 'ON' && ' + ASan/UBSan' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF
          - compiler: clang
            cxx: clang++
            build_type: Release
            sanitizers: OFF
          - compiler: gcc
            cxx: g++
            build_type: Debug
            sanitizers: ON
          - compiler: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON

    env:
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libboost-dev clang-format clang-tools
          # clang needs compiler-rt for -fsanitize=address,undefined
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang libclang-rt-dev
          fi

      - name: Check changed C++ formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="origin/$BASE_REF"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
              base="HEAD^"
            else
              base="$EVENT_BEFORE"
            fi
          else
            # Check the entire feature branch, not only the most recent push.
            base="origin/main"
          fi

          diff="$(git diff -U0 "$base...$GITHUB_SHA" -- '*.cpp' '*.hpp')"
          if [[ -z "$diff" ]]; then
            echo "No changed C++ files to format-check."
            exit 0
          fi

          command -v clang-format-diff >/dev/null || { echo "clang-format-diff is required but was not found."; exit 1; }
          formatting_diff="$(printf '%s\n' "$diff" | clang-format-diff -p1 -style=file || true)"
          if [[ -n "$formatting_diff" ]]; then
            printf '%s\n' "$formatting_diff"
            echo "Changed C++ lines are not clang-formatted."
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPROXY_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Smoke test
        run: bash scripts/smoke_test.sh build/http_proxy

      - name: Integration test
        run: bash scripts/integration_test.sh build/http_proxy
