name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}${{ matrix.sanitizers == 'ON' && ' + ASan/UBSan' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF
          - compiler: clang
            cxx: clang++
            build_type: Release
            sanitizers: OFF
          - compiler: gcc
            cxx: g++
            build_type: Debug
            sanitizers: ON
          - compiler: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON

    env:
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libboost-dev
          # clang needs compiler-rt for -fsanitize=address,undefined
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang libclang-rt-dev
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPROXY_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Smoke test
        run: scripts/smoke_test.sh build/http_proxy